[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-ipd-fingerprint"
version = "0.1.0"
description = "Behavioral fingerprinting of LLMs in the Iterated Prisoner's Dilemma"
requires-python = ">=3.9"
dependencies = [
    "axelrod>=4.14.0",
    "litellm>=1.0.0",
    "matplotlib>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
